<div class="app-wrapper">
  <!-- HEADER: Iko juu kabisa kwa upana wote -->
  <app-header (sidebarToggle)="toggleSidebar()"></app-header>

  <!-- SEHEMU YA CHINI YA HEADER -->
  <div class="app-body" [class.sidebar-closed]="!isSidebarOpen">
    
    <!-- SIDEBAR: Sasa inaanza chini ya header -->
    <app-sidebar
      [isOpen]="isSidebarOpen"
      [class.open]="isSidebarOpen"
      (closeSidebar)="closeSidebar()">
    </app-sidebar>

    <!-- Overlay for mobile when sidebar is open -->
    <div class="sidebar-overlay" *ngIf="isMobile && isSidebarOpen" (click)="closeSidebar()"></div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      <main class="page-content">
        <router-outlet></router-outlet>
      </main>

      <footer class="app-footer">
        <p>
          Developed by 
          <a href="https://tzonetech.co.tz" target="_blank" class="footer-link">
            <span class="tz">TZONE</span><span class="tech">TECH</span>
          </a>
        </p>
      </footer>
    </div>
  </div>
</div>
