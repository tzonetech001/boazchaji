<aside class="sidebar">
  <div class="sidebar-brand">
    <img src="boaz.jpg" alt="Logo" class="brand-logo">
    <h2>BOAZCHAJI</h2>
  </div>

  <nav class="sidebar-nav">
    <ul>
      <li>
        <a routerLink="/dashboard" routerLinkActive="active" (click)="onLinkClick()">
          <i class="fas fa-home"></i>
          <span>{{ 'MENU.DASHBOARD' | translate }}</span>
        </a>
      </li>
      <li>
        <a routerLink="/services" routerLinkActive="active" (click)="onLinkClick()">
          <i class="fas fa-tools"></i>
          <span>{{ 'MENU.SERVICES' | translate }}</span>
        </a>
      </li>
      <li>
        <a routerLink="/history" routerLinkActive="active" (click)="onLinkClick()">
          <i class="fas fa-history"></i>
          <span>{{ 'MENU.HISTORY' | translate }}</span>
        </a>
      </li>
      
      <!-- Admin Only Section -->
      <li *ngIf="isAdmin">
        <a routerLink="/settings" routerLinkActive="active" (click)="onLinkClick()">
          <i class="fas fa-users-cog"></i>
          <span>{{ 'MENU.MANAGE_AGENTS' | translate }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <p>&copy; 2024 BOAZCHAJI</p>
  </div>
</aside>
