<header class="header">
  <div class="header-left">
    <button class="hamburger" (click)="toggleSidebar()" [attr.aria-label]="t('menu')">
      <i class="fas fa-bars"></i>
    </button>

    <div class="logo-container">
      <img src="boaz.jpg" alt="BOAZCHAJI Logo" class="logo-img">
      <span class="logo-text">BOAZCHAJI</span>
    </div>
  </div>

  <div class="header-right">
    
    <!-- 1. NOTIFICATION BELL (Mpya) -->
    <button class="icon-btn notif-btn" routerLink="/notifications" [title]="t('notifications')">
      <i class="fas fa-bell"></i>
      <!-- Badge ya Idadi (Inaonekana kama kuna taarifa) -->
      <span class="notif-badge" *ngIf="unreadCount > 0">
        {{ unreadCount > 99 ? '99+' : unreadCount }}
      </span>
    </button>

    <!-- 2. LANGUAGE TOGGLE -->
    <button class="icon-btn" (click)="toggleLanguage()" [title]="t('switchLanguage')">
      <img [src]="'assets/icons/' + (langService.lang() === 'sw' ? 'sw' : 'gb') + '.svg'" 
           alt="Flag" 
           class="lang-flag">
    </button>

    <!-- 3. THEME TOGGLE -->
    <button class="icon-btn" (click)="toggleTheme()" [title]="t('toggleTheme')">
      <i class="fas" [ngClass]="isDarkMode ? 'fa-sun' : 'fa-moon'"></i>
    </button>

    <!-- 4. PROFILE DROPDOWN -->
    <div class="profile-dropdown">
      <div class="profile-info" (click)="toggleDropdown()">
        <img [src]="userProfileImage" alt="Profile" class="profile-img">
        <div class="user-details hide-on-mobile">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">{{ t(userRole) }}</span>
        </div>
        <i class="fas fa-chevron-down"></i>
      </div>

      <div class="dropdown-menu" [class.show]="isDropdownOpen">
        <a routerLink="/profile" class="dropdown-item" (click)="isDropdownOpen = false">
          <i class="fas fa-user"></i> {{ t('profile') }}
        </a>
        <a routerLink="/settings" class="dropdown-item" (click)="isDropdownOpen = false">
          <i class="fas fa-cog"></i> {{ t('settings') }}
        </a>
        <a (click)="logout()" class="dropdown-item text-danger">
          <i class="fas fa-sign-out-alt"></i> {{ t('logout') }}
        </a>
      </div>
    </div>
  </div>
</header>
