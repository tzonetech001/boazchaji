<div class="settings-container">
  <div class="settings-header">
    <h2><i class="fas fa-cog"></i> Mipangilio</h2>
    <p>Badilisha lugha na muonekano wa mfumo.</p>
  </div>

  <div class="form-card">
    <form [formGroup]="settingsForm">
      
      <div class="form-group">
        <label>Lugha</label>
        <select formControlName="language" class="form-control">
          <option value="sw">Kiswahili</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="form-group">
        <label>Muonekano</label>
        <select formControlName="theme" class="form-control">
          <option value="light">Mwanga</option>
          <option value="dark">Giza</option>
        </select>
      </div>

    </form>
  </div>
</div>
