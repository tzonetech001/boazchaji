<div class="settings-container">

  <div class="alert-success" *ngIf="savedMessage">
    <i class="fas fa-check-circle"></i> {{ savedMessage }}
  </div>

  <div class="settings-header">
    <div>
      <h2><i class="fas fa-cog"></i> {{ t('title') }}</h2>
      <p>{{ t('subtitle') }}</p>
    </div>
  </div>

  <!-- Tabs (Zimebakisha 2 tu) -->
  <div class="tabs">
    <button [class.active]="activeTab === 'appearance'" (click)="setTab('appearance')">
      <i class="fas fa-palette"></i> {{ t('appearance') }}
    </button>
    <button [class.active]="activeTab === 'language'" (click)="setTab('language')">
      <i class="fas fa-globe"></i> {{ t('language') }}
    </button>
  </div>

  <form [formGroup]="settingsForm">

    <!-- TAB 1: APPEARANCE -->
    <div class="tab-content" *ngIf="activeTab === 'appearance'">
      <div class="form-card">
        <div class="card-header">
          <h3><i class="fas fa-paint-brush"></i> {{ t('theme') }}</h3>
          <p>{{ t('themeDesc') }}</p>
        </div>

        <div class="theme-options">
          <label class="theme-option" [class.selected]="settingsForm.value.theme === 'light'">
            <input type="radio" formControlName="theme" value="light" hidden>
            <div class="theme-preview light-preview">
              <div class="preview-bar"></div>
              <div class="preview-body"></div>
            </div>
            <span><i class="fas fa-sun"></i> {{ t('light') }}</span>
          </label>

          <label class="theme-option" [class.selected]="settingsForm.value.theme === 'dark'">
            <input type="radio" formControlName="theme" value="dark" hidden>
            <div class="theme-preview dark-preview">
              <div class="preview-bar"></div>
              <div class="preview-body"></div>
            </div>
            <span><i class="fas fa-moon"></i> {{ t('dark') }}</span>
          </label>

          <label class="theme-option" [class.selected]="settingsForm.value.theme === 'system'">
            <input type="radio" formControlName="theme" value="system" hidden>
            <div class="theme-preview system-preview">
              <div class="preview-bar"></div>
              <div class="preview-body"></div>
            </div>
            <span><i class="fas fa-desktop"></i> {{ t('system') }}</span>
          </label>
        </div>
      </div>
    </div>

    <!-- TAB 2: LANGUAGE -->
    <div class="tab-content" *ngIf="activeTab === 'language'">
      <div class="form-card">
        <div class="card-header">
          <h3><i class="fas fa-language"></i> {{ t('languageTitle') }}</h3>
          <p>{{ t('languageDesc') }}</p>
        </div>

        <div class="lang-options">
          <!-- Kiswahili (sw.svg) -->
          <label class="lang-option" [class.selected]="settingsForm.value.language === 'sw'">
            <input type="radio" formControlName="language" value="sw" hidden>
            <img src="assets/icons/sw.svg" alt="Swahili Flag" class="flag-img">
            <div class="lang-details">
              <strong>{{ t('swahili') }}</strong>
              <small>Kiswahili</small>
            </div>
            <i class="fas fa-check-circle check"></i>
          </label>

          <!-- English (gb.svg) -->
          <label class="lang-option" [class.selected]="settingsForm.value.language === 'en'">
            <input type="radio" formControlName="language" value="en" hidden>
            <img src="assets/icons/gb.svg" alt="English Flag" class="flag-img">
            <div class="lang-details">
              <strong>{{ t('english') }}</strong>
              <small>English</small>
            </div>
            <i class="fas fa-check-circle check"></i>
          </label>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button type="button" class="btn-primary" (click)="saveAll()">
        <i class="fas fa-save"></i> {{ t('save') }}
      </button>
      <button type="button" class="btn-secondary" (click)="resetDefaults()">
        <i class="fas fa-undo"></i> {{ t('reset') }}
      </button>
    </div>
  </form>
</div>
