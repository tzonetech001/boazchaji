<div class="form-container">
  <div class="form-card">
    <div class="form-header">
      <h2><i class="fas fa-plus-circle"></i> Rekodi Huduma</h2>
    </div>

    <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()">
      
      <!-- Agent Selector (Admin pekee) -->
      <div class="form-group" *ngIf="isAdmin">
        <label>Mteja wa Agent Gani? <span class="required">*</span></label>
        <select formControlName="agent_id" class="form-control">
          <option value="">Chagua Agent...</option>
          <option *ngFor="let a of agents" [value]="a.id">{{ a.first_name }} {{ a.last_name }}</option>
        </select>
      </div>

      <!-- Mteja -->
      <div class="form-row">
        <div class="form-group relative">
          <label>Jina la Mteja <span class="required">*</span></label>
          <input type="text" formControlName="customer_name" class="form-control" placeholder="Anza kuandika..." autocomplete="off">
          <div class="autocomplete-dropdown" *ngIf="showDropdown">
            <div class="dropdown-item" *ngFor="let c of searchResults" (click)="selectCustomer(c)">
              <strong>{{ c.name }}</strong> - {{ c.phone }}
            </div>
          </div>
          <small class="add-new" *ngIf="!showDropdown && serviceForm.value.customer_name && !serviceForm.value.customer_id" (click)="createNewCustomer()">
            <i class="fas fa-plus-circle"></i> Save "{{serviceForm.value.customer_name}}" kama mteja mpya
          </small>
        </div>
        <div class="form-group">
          <label>Namba ya Simu <span class="required">*</span></label>
          <input type="tel" formControlName="customer_phone" class="form-control" placeholder="07XXXXXXXX">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Jina la Kifaa <span class="required">*</span></label>
          <input type="text" formControlName="device_name" class="form-control">
        </div>
        <div class="form-group">
          <label>Aina ya Kifaa <span class="required">*</span></label>
          <div style="display:flex; gap:10px;">
            <select formControlName="device_type_id" class="form-control">
              <option value="">Chagua...</option>
              <option *ngFor="let d of deviceTypes" [value]="d.id">{{ d.name }}</option>
            </select>
            <button type="button" class="btn-primary" (click)="addDeviceType()"><i class="fas fa-plus"></i></button>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Idadi <span class="required">*</span></label>
          <input type="number" formControlName="quantity" class="form-control">
        </div>
        <div class="form-group">
          <label>Kiasi (TZS) <span class="required">*</span></label>
          <input type="number" formControlName="amount" class="form-control">
        </div>
      </div>

      <!-- Payment Checkbox -->
      <div class="form-group">
        <label>Hali ya Malipo</label>
        <label style="display:flex; align-items:center; gap:10px; cursor:pointer;">
          <input type="checkbox" formControlName="status" [value]="serviceForm.value.status === 'paid' ? 'paid' : 'pending'" 
                 (change)="serviceForm.patchValue({status: $any($event.target).checked ? 'paid' : 'pending'})">
          Amelipia Kikamilifu
        </label>
      </div>

      <div class="form-group">
        <label>Picha (Hiari)</label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*" class="form-control">
        <img *ngIf="imagePreview" [src]="imagePreview" style="max-height:100px; margin-top:10px; border-radius:8px;">
      </div>

      <div class="total-display">
        <span>Jumla:</span> <strong>{{ (serviceForm.value.quantity * serviceForm.value.amount) | number }} TZS</strong>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" routerLink="/services">Ghairi</button>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting">Hifadhi</button>
      </div>
    </form>
  </div>
</div>
