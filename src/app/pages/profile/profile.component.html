<div class="profile-container">
  <div class="profile-header">
    <div class="avatar-section">
      <img [src]="'https://ui-avatars.com/api/?name=' + user?.first_name + '+' + user?.last_name + '&background=0284c7&color=fff&size=128'" alt="Avatar" class="avatar">
      <div class="user-info">
        <h2>{{ user?.first_name }} {{ user?.last_name }}</h2>
        <p><span class="badge">{{ user?.role | uppercase }}</span> {{ user?.phone }}</p>
      </div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button [class.active]="activeTab === 'profile'" (click)="setTab('profile')">
      <i class="fas fa-user"></i> Taarifa Binafsi
    </button>
    <button [class.active]="activeTab === 'security'" (click)="setTab('security')">
      <i class="fas fa-lock"></i> Usalama (Password)
    </button>
  </div>

  <!-- TAB 1: PROFILE -->
  <div class="tab-content" *ngIf="activeTab === 'profile'">
    <div class="alert-success" *ngIf="successMessage"><i class="fas fa-check"></i> {{ successMessage }}</div>
    <div class="alert-error" *ngIf="errorMessage"><i class="fas fa-times"></i> {{ errorMessage }}</div>

    <form [formGroup]="profileForm" (ngSubmit)="onUpdateProfile()">
      <div class="form-row">
        <div class="form-group">
          <label>Jina la Kwanza</label>
          <input type="text" formControlName="first_name" class="form-control">
        </div>
        <div class="form-group">
          <label>Jina la Kati</label>
          <input type="text" formControlName="second_name" class="form-control">
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Jina la Mwisho</label>
          <input type="text" formControlName="last_name" class="form-control">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email" class="form-control">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Lugha (Language)</label>
          <select formControlName="language" class="form-control">
            <option value="sw">Kiswahili</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mandhari (Theme)</label>
          <select formControlName="theme" class="form-control">
            <option value="light">Light Mode</option>
            <option value="dark">Dark Mode</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn-primary" [disabled]="profileForm.invalid">
        <i class="fas fa-save"></i> Hifadhi Mabadiliko
      </button>
    </form>
  </div>

  <!-- TAB 2: SECURITY -->
  <div class="tab-content" *ngIf="activeTab === 'security'">
    <div class="alert-success" *ngIf="passwordMessage && passwordMessage.includes('imebadilishwa')">
      <i class="fas fa-check"></i> {{ passwordMessage }}
    </div>
    <div class="alert-error" *ngIf="passwordMessage && !passwordMessage.includes('imebadilishwa')">
      <i class="fas fa-times"></i> {{ passwordMessage }}
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()">
      <div class="form-group">
        <label>Password ya Sasa</label>
        <input type="password" formControlName="current_password" class="form-control">
      </div>
      <div class="form-group">
        <label>Password Mpya</label>
        <input type="password" formControlName="new_password" class="form-control">
      </div>
      <div class="form-group">
        <label>Rudia Password Mpya</label>
        <input type="password" formControlName="confirm_password" class="form-control">
      </div>

      <button type="submit" class="btn-primary" [disabled]="passwordForm.invalid">
        <i class="fas fa-key"></i> Badilisha Password
      </button>
    </form>
  </div>
</div>
