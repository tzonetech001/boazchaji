<div class="user-management-container">
  <!-- Message Alert (Inaonekana kwa sekunde 2) -->
  <div class="alert-overlay" *ngIf="message.text">
    <div class="alert-box" [ngClass]="message.type">
      <i class="fas" [ngClass]="message.type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'"></i>
      {{ message.text }}
    </div>
  </div>

  <div class="header-actions">
    <h2><i class="fas fa-users"></i> Usimamizi wa Watumiaji</h2>
    <button class="btn-primary" (click)="toggleForm()">
      <i class="fas" [ngClass]="showForm ? 'fa-times' : 'fa-plus'"></i>
      {{ showForm ? 'Funga' : 'Ongeza Mtumiaji' }}
    </button>
  </div>

  <!-- Form ya Kuongeza / Kuedit -->
  <div class="form-card" *ngIf="showForm">
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label>Jina la Kwanza</label>
          <input type="text" formControlName="first_name" class="form-control">
        </div>
        <div class="form-group">
          <label>Jina la Mwisho</label>
          <input type="text" formControlName="last_name" class="form-control">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Namba ya Simu</label>
          <input type="tel" formControlName="phone" class="form-control" placeholder="07XXXXXXXX">
        </div>
        <div class="form-group">
          <label>Jinsia</label>
          <select formControlName="sex" class="form-control">
            <option value="Male">Me</option>
            <option value="Female">Ke</option>
          </select>
        </div>
      </div>
      <div class="form-group" *ngIf="!isEditing">
        <label>Password ya Awali</label>
        <input type="password" formControlName="password" class="form-control">
      </div>
      <button type="submit" class="btn-primary" [disabled]="userForm.invalid">
        <i class="fas fa-save"></i> {{ isEditing ? 'Hifadhi Mabadiliko' : 'Hifadhi Mtumiaji' }}
      </button>
    </form>
  </div>

  <!-- Orodha ya Watumiaji -->
  <div class="table-responsive">
    <table class="data-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Jina Kamili</th>
          <th>Simu</th>
          <th>Jinsia</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{ user.first_name }} {{ user.last_name }}</td>
          <td>{{ user.phone }}</td>
          <td>{{ user.sex }}</td>
          <td>{{ user.email || '-' }}</td>
          <td class="action-buttons">
            <!-- Edit -->
            <button class="btn-icon edit" (click)="editUser(user)" title="Edit">
              <i class="fas fa-edit"></i>
            </button>
            <!-- Deactivate -->
            <button class="btn-icon deactivate" (click)="deactivateUser(user.id)" title="Deactivate">
              <i class="fas fa-user-slash"></i>
            </button>
            <!-- Trash (Delete) -->
            <button class="btn-icon delete" (click)="moveToTrash(user.id)" title="Move to Trash">
              <i class="fas fa-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
